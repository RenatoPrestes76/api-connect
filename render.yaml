services:
  - type: web
    name: seltriva-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.api
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 3001
      - key: LOG_LEVEL
        value: info
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Required for the process to boot at all (packages/config's
      # validateEnv() throws immediately if either is unset) — set these in
      # the Render dashboard, not here, since they're secrets.
      - key: API_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Optional — see .env.example for the full list and defaults.
      - key: ATLAS_MASTER_KEY
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
