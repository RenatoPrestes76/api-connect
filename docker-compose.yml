services:
  postgres:
    image: postgres:16-alpine
    container_name: seltriva_postgres
    environment:
      POSTGRES_USER: seltriva
      POSTGRES_PASSWORD: seltriva_dev_password
      POSTGRES_DB: seltriva_connect
    ports:
      # Host-side port intentionally not 5432 — this machine already runs a
      # separate, unrelated native PostgreSQL Windows service bound to 5432,
      # and both processes ended up listening on that port simultaneously,
      # so host connections could land on either one nondeterministically
      # (Prisma hit the native instance and got a real but wrong "access
      # denied", since it obviously has no `seltriva` role/database). The
      # container's own internal port stays the Postgres default.
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seltriva']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seltriva

  redis:
    image: redis:7-alpine
    container_name: seltriva_redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seltriva

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: seltriva_api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://seltriva:seltriva_dev_password@postgres:5432/seltriva_connect
      REDIS_URL: redis://redis:6379
      API_PORT: 3001
      API_SECRET_KEY: dev_secret_key_change_in_production
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - seltriva
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages

volumes:
  postgres_data:

networks:
  seltriva:
    driver: bridge
